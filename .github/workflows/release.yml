name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing vX.Y.Z release tag to resume; dispatch this workflow with --ref <tag>
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  CARGO_INCREMENTAL: "0"

jobs:
  release-meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      tag_ref: ${{ steps.meta.outputs.tag_ref }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - id: meta
        env:
          EVENT_REF: ${{ github.ref }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          tag="${EVENT_TAG:-${INPUT_TAG:-}}"
          [[ -n "$tag" ]] || { echo "::error::tag_name is required"; exit 1; }
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "::error::invalid release tag: $tag"; exit 1; }
          tag_ref="refs/tags/${tag}"
          [[ "$EVENT_REF" == "$tag_ref" ]] || {
            echo "::error::release workflow must run at ${tag_ref}; got ${EVENT_REF}. For manual recovery, dispatch with --ref ${tag}."
            exit 1
          }
          {
            echo "tag_name=$tag"
            echo "tag_ref=$tag_ref"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

  preflight:
    needs: release-meta
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-meta.outputs.tag_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require tag commit on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Validate every release version before publication
        env:
          EXPECTED_VERSION: ${{ needs.release-meta.outputs.tag_name }}
        run: bash scripts/check-version-sync.sh
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          components: rustfmt,clippy
      - uses: taiki-e/install-action@6d9ce389421e24f7b73aff5e841bbe5a6b4c974c # nextest
        with:
          tool: nextest@0.9.100
      - uses: taiki-e/install-action@6d9ce389421e24f7b73aff5e841bbe5a6b4c974c # cargo-audit
        with:
          tool: cargo-audit@0.22.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo nextest run --workspace --all-features --profile ci
      # Vulnerabilities are always fatal; deny unsound advisories explicitly.
      # The locked graph currently carries a tracked yanked-only spin warning.
      - run: cargo audit --deny unsound
      - run: bash scripts/check-ci-policy.sh
      - run: bash scripts/validate-plugin-layout.sh
      - run: bash tests/docs-contract.sh
      - run: shellcheck install.sh entrypoint.sh scripts/*.sh tests/*.sh
      - run: npm test --prefix packages/apprise-rmcp
      - run: npm run check --prefix packages/apprise-rmcp

  build:
    needs: [release-meta, preflight]
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: rapprise-linux-x86_64
            archive: rapprise-x86_64.tar.gz
            ext: ""
          - target: x86_64-pc-windows-msvc
            artifact: rapprise-windows-x86_64.exe
            archive: rapprise-windows-x86_64.tar.gz
            ext: ".exe"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-meta.outputs.tag_ref }}
          persist-credentials: false
      - name: Install Rust and kache
        uses: ./.github/actions/setup-rust-kache
        with:
          targets: ${{ matrix.target }}
      - name: Ensure Windows target is installed for the active toolchain
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          active_toolchain="$(rustup show active-toolchain | awk '{print $1}')"
          rustup target add --toolchain "${active_toolchain}" "${{ matrix.target }}"
      - name: Install and normalize Windows cross-linker tools
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld llvm nasm
          for tool in llvm-lib clang-cl lld-link; do
            if command -v "$tool" >/dev/null 2>&1; then
              continue
            fi
            candidate="$(find /usr/bin -maxdepth 1 -name "${tool}-*" -print | sort -V | tail -n 1)"
            if [[ -z "$candidate" ]]; then
              echo "::error::Unable to locate ${tool} after installing LLVM"
              exit 1
            fi
            sudo ln -sf "$candidate" "/usr/local/bin/${tool}"
          done
          llvm-lib --version
          clang-cl --version
          lld-link --version
      - uses: taiki-e/install-action@6d9ce389421e24f7b73aff5e841bbe5a6b4c974c # cargo-xwin
        if: matrix.target == 'x86_64-pc-windows-msvc'
        with:
          tool: cargo-xwin@0.20.2
      - name: Build Linux
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build --release --locked --target ${{ matrix.target }} --bin rapprise
      - name: Build Windows
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo xwin build --release --locked --target ${{ matrix.target }} --bin rapprise
      - name: Stage archive and published digest
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/rapprise${{ matrix.ext }}" "${{ matrix.artifact }}"
          mkdir archive
          cp "${{ matrix.artifact }}" "archive/rapprise${{ matrix.ext }}"
          tar -C archive -czf "${{ matrix.archive }}" "rapprise${{ matrix.ext }}"
          sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
      - id: attestation
        name: Attest the exact archive consumed by installers
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: ${{ matrix.archive }}
      - name: Stage offline attestation bundle
        run: cp "${{ steps.attestation.outputs.bundle-path }}" "${{ matrix.archive }}.sigstore.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
            ${{ matrix.archive }}.sigstore.json

  build-installer:
    needs: [release-meta, preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ needs.release-meta.outputs.tag_ref }}
          persist-credentials: false
      - run: |
          cp scripts/install.sh rapprise-installer.sh
          sha256sum rapprise-installer.sh > rapprise-installer.sh.sha256
      - id: attestation
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: rapprise-installer.sh
      - run: cp "${{ steps.attestation.outputs.bundle-path }}" rapprise-installer.sh.sigstore.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rapprise-installer
          path: |
            rapprise-installer.sh
            rapprise-installer.sh.sha256
            rapprise-installer.sh.sigstore.json

  publish-release:
    needs: [release-meta, preflight, build, build-installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/release-assets
          merge-multiple: true
      - name: Verify and aggregate release checksums
        working-directory: dist/release-assets
        run: |
          set -euo pipefail
          for checksum in ./*.sha256; do sha256sum --check "$checksum"; done
          cat -- ./*.sha256 | sort -k2 > SHA256SUMS
      - name: Attach verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-meta.outputs.tag_name }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/release-assets/* --clobber --repo "$GITHUB_REPOSITORY"

  npm:
    name: Publish @dinglebear/rapprise to npm
    needs: [release-meta, preflight, publish-release]
    uses: dinglebear-ai/workflows/.github/workflows/npm-trusted-publish.yml@64d705af6e164aac58d507df6fb2f6bdc8a4d22d
    with:
      checkout-ref: ${{ needs.release-meta.outputs.tag_ref }}
      expected-version: ${{ needs.release-meta.outputs.version }}
      working-directory: packages/apprise-rmcp
      cache-dependency-path: packages/apprise-rmcp/package.json
      enable-cache: false
      install-command: "true"
      verify-command: npm test && npm run check
