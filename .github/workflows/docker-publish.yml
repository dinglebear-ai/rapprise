name: Docker Publish

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dinglebear-ai/rapprise

jobs:
  preflight:
    name: Verify released source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a versioned tag on main
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || {
            echo "::error::invalid release tag: $RELEASE_TAG"
            exit 1
          }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

  container:
    name: Build, scan, attest, and publish
    needs: preflight
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: dinglebear-ai/workflows/.github/workflows/hosted-container-release.yml@eb5f36cf517ffc949aca1c81e2ccbc71b5a85267
    with:
      checkout-ref: ${{ github.event.release.tag_name }}
      image: ghcr.io/dinglebear-ai/rapprise
      release-tag: ${{ github.event.release.tag_name }}
      dockerfile: config/Dockerfile
      smoke-command: docker run --rm "$IMAGE_REF" --version
      cache-scope: rapprise-release
      timeout-minutes: 60
    secrets:
      REGISTRY_USERNAME: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  promote-tags:
    name: Promote release aliases
    needs: container
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the verified digest
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          image="${REGISTRY}/${IMAGE_NAME}"
          digest="$(docker buildx imagetools inspect "${image}:${RELEASE_TAG}" --format '{{.Manifest.Digest}}')"
          short_sha="${GITHUB_SHA:0:12}"
          for tag in "$version" latest "sha-${short_sha}"; do
            docker buildx imagetools create --tag "${image}:${tag}" "${image}@${digest}"
          done
