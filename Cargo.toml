[workspace]
members = ["xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
authors = ["dinglebear.ai <hello@dinglebear.ai>"]
license = "MIT"
readme = "README.md"
homepage = "https://rapprise.dinglebear.ai"
repository = "https://github.com/dinglebear-ai/rapprise"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
dirs = "5"
dotenvy = "0.15.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rmcp = { version = "=3.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = "0.5"
tower-http = "0.6"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = "0.3"
url = "2"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
private_intra_doc_links = "warn"
bare_urls = "warn"
unescaped_backticks = "warn"
invalid_html_tags = "deny"
redundant_explicit_links = "warn"

[workspace.lints.rust]
missing_crate_level_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
mod_module_files = "deny"
missing_safety_doc = "deny"

[package]
name = "apprise-mcp"
version = "0.2.3"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
publish = false
categories = ["command-line-utilities", "api-bindings", "network-programming", "development-tools"]
keywords = ["mcp", "apprise", "notifications", "rmcp", "homelab"]
description = "Apprise notifications over MCP and CLI with authenticated stdio and HTTP transports."
autobins = false

[[bin]]
name = "rapprise"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio.workspace = true

# HTTP / MCP transport
axum.workspace = true
rmcp = { workspace = true, features = [
  "server",
  "macros",
  "transport-streamable-http-server",
  "transport-io",
] }
tower-http = { workspace = true, features = ["cors", "limit", "trace"] }

# Serialization
serde.workspace = true
serde_json.workspace = true

# Config
toml.workspace = true

# OAuth + JWT
lab-auth = { git = "https://github.com/dinglebear-ai/labby.git", rev = "87cec3241f9baef22335de9cc8629ebbcd8ba047", package = "lab-auth" }
url.workspace = true

# HTTP client
reqwest.workspace = true
futures-util.workspace = true

# Platform directories
dirs.workspace = true

# Errors
anyhow.workspace = true
thiserror.workspace = true

# Logging
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json", "fmt"] }
dotenvy.workspace = true
tempfile.workspace = true

[features]
test-support = []

[dev-dependencies]
apprise-mcp = { path = ".", features = ["test-support"] }
tokio.workspace = true
rmcp = { workspace = true, features = [
  "client",
  "transport-child-process",
] }
tower = { workspace = true, features = ["util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[lints]
workspace = true
